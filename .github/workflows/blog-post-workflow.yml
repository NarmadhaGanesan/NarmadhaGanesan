name: Latest Medium posts
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 08:30 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@narmadhaganesan1"
          max_post_count: 4
